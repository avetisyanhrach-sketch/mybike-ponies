name: Collect Ponies Wednesday results

on:
  schedule:
    # Times are UTC. The script itself works out the Los Angeles date.
    - cron: '30 17 * * 3'  # Wed 10:30 PDT / 9:30 PST  – first pass after the 6–9 window
    - cron: '30 21 * * 3'  # Wed afternoon              – late uploads
    - cron: '30 6 * * 4'   # Wed 23:30 PDT / 22:30 PST  – last pass on the day itself
    - cron: '0 18 * * 4'   # Thu                         – catch-up via "this week"
    - cron: '0 18 * * 0'   # Sun                         – final catch-up before the week closes
  workflow_dispatch:
    inputs:
      date:
        description: 'Stage date YYYY-MM-DD (empty = last Wednesday)'
        required: false

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Collect from Strava
        env:
          STRAVA_COOKIE: ${{ secrets.STRAVA_COOKIE }}
        run: node scripts/collect.mjs ${{ github.event.inputs.date && format('--date {0}', github.event.inputs.date) || '' }}

      - name: Build data.json
        run: node scripts/build.mjs

      - name: Commit results
        run: |
          git config user.name "ponies-bot"
          git config user.email "ponies-bot@users.noreply.github.com"
          git add data docs
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Results update $(date -u +%F)"
          git push
